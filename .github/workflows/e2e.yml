name: e2e-examples

# Builds every example in examples/<image>/<variant>/ on top of a locally-built
# varde base (the musl default), smoke-tests that the app runs, and asserts an
# image-size budget. The bases are built with Nix; the musl variants are not in
# the public Nix cache, so any the varde Cachix cache does not already hold
# compile from source (see build.yml's `heavy` note — a cache-cold run takes
# hours); Actions minutes are free on public repos.
#
# Runs on PRs that touch an input, via workflow_run after every successful
# *push* build-image run on main (merges that rebuild the images; build.yml's
# push trigger is path-filtered, so an examples-only merge gets no post-merge
# run here — its PR-time run is its coverage), and via workflow_call from
# bump-lock.yml on the bumped lock BEFORE it lands. The weekly publish itself
# never chains here: bump-lock dispatches build.yml with GITHUB_TOKEN, and
# GitHub creates no workflow_run event for a run started that way (seen
# 2026-10-19: dispatch build 39297073830 succeeded, no e2e run followed; the
# same held for every weekly dispatch since the trigger was added). That is
# why the bump verifies e2e itself. Chaining off a build also means the Cachix
# cache that run just populated is warm. Note a workflow_run failure emails
# nobody: the Actions tab is the signal.
on:
  pull_request:
    paths:
      - "examples/**"
      - "images/**"
      - "lib/**"
      - "flake.nix"
      - "flake.lock"
      - "scripts/e2e.sh"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
  # bump-lock.yml runs the examples against a bumped lock before it lands.
  workflow_call:
    inputs:
      ref:
        description: Commit to check out (the bump branch head)
        type: string
        required: true
  workflow_run:
    workflows: [build-image]
    types: [completed]
    branches: [main] # head_branch of the triggering run; the bump's dispatch resolves to main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: build + smoke examples
    runs-on: ubuntu-latest
    # Post-publish only for main builds that succeeded. build-image also runs
    # on pull_request (forks included); a fork PR whose head branch is
    # literally named "main" would pass the branches filter and run its
    # scripts/e2e.sh with our secrets, so exclude PR-triggered runs explicitly.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    permissions:
      contents: read
      actions: read # list this PR's build-image runs (the wait step)
    steps:
      # On a PR this starts alongside the PR's build-image run. When the PR
      # changes a shared musl input (an overlay, lib/, the lock), every
      # musl base is new to Cachix, so this job compiled the whole chain
      # again on one runner, racing build-image instead of reusing it, and
      # any flaky test in a dependency's check phase failed it (seen
      # 2026-08-06, python3.14-filelock, run 31073369288). Wait for that
      # run first: its legs push every path they finish, so the bases
      # below are then mostly cache hits. Same-repo PRs only (a fork's
      # build cannot push to Cachix), capped so a stuck build cannot eat
      # this job's budget; past the cap it builds anyway.
      - name: Wait for this PR's build-image run to warm Cachix
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          while :; do
            runs=$(gh run list -R "$GITHUB_REPOSITORY" -w build.yml -c "$SHA" -e pull_request \
                     --json databaseId,status)
            total=$(jq length <<<"$runs")
            open=$(jq -r '[.[] | select(.status != "completed") | .databaseId] | join(" ")' <<<"$runs")
            waited=$(( ($(date +%s) - start) / 60 ))
            # build.yml is path-filtered: an examples-only PR has no run.
            if [ "$total" -eq 0 ] && [ "$waited" -ge 3 ]; then
              echo "no build-image run for $SHA; building cold"; break
            fi
            if [ "$total" -gt 0 ] && [ -z "$open" ]; then
              echo "build-image finished for $SHA after ${waited}m"; break
            fi
            if [ "$waited" -ge 150 ]; then
              echo "::warning::build-image ($open) still running after ${waited}m; building without waiting further"; break
            fi
            sleep 60
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # In a workflow_run run github.sha is the *current* tip of main, not
          # the commit build-image built; pin to that commit so the examples
          # are checked against the exact lock the published images came from.
          # Called from bump-lock.yml, inputs.ref is the unlanded bump commit.
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false # nothing here pushes via git
      # `determinate: false` -> plain upstream Nix; avoids the FlakeHub login
      # warning on every job (we use Cachix, not FlakeHub — see build.yml).
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      # Pull the bases from the shared cache that build.yml populates, instead of
      # recompiling the from-source musl variants here. (Reads are anonymous on
      # the public cache; the token is only needed to push.) Same pushFilter as
      # build.yml: image tarballs are cheap to rebuild and too big to cache.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: varde
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(\.tar\.gz$|-customisation-layer$|-sbom$)'
      - name: Build examples on local bases, smoke-test, assert size budgets
        run: scripts/e2e.sh
