name: verify

# Full pre-merge check of a branch, started by dispatch: the whole build
# matrix (verify_only: build, SBOM, scan; never sign, push or tag) plus the
# e2e examples, exactly what bump-lock.yml runs before it lands a lock.
#
# Exists for branches pushed by a bot. A PR opened or pushed with
# GITHUB_TOKEN raises no pull_request event, so build.yml / e2e.yml never run
# on it; workflow_dispatch is the documented exception. The run's checks
# attach to the branch head commit, so they show on the PR.
#
# Dispatch it only AFTER reading the branch's diff. It runs that code with
# the Cachix push token (secrets: inherit) and, through build.yml, jobs that
# hold packages/id-token/attestations write — verify_only never uses them,
# but code under test could. That is why rebuild-fix.yml never dispatches it
# for its agent-written fix: a person does, from the PR.

on:
  workflow_dispatch:

permissions:
  contents: read

# Not "verify-<ref>": a called workflow's own concurrency key evaluates with
# the caller's github.workflow/github.ref, so build.yml and e2e.yml key on
# exactly that, and sharing it would make this run wait on its own children.
concurrency:
  group: verify-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A called workflow's jobs can hold at most the caller job's permissions
    # (see bump-lock.yml's verify-build); verify_only uses none of the writes.
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      actions: read
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      verify_only: true
    secrets: inherit # CACHIX_AUTH_TOKEN: warm the cache for the merge build

  e2e:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit
