name: tmp-amx-proof

# TEMPORARY (PR #27 only, delete before merge): prove the AMX shim bites by
# running it against the published, unpatched rabbitmq musl image — that boot
# must abort with "Failed to set alternate signal stack".
on:
  pull_request:
    paths: [".github/workflows/tmp-amx-proof.yml", ".github/smoke/**"]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: varde
      - name: Unpatched image must abort under the shim
        run: |
          set -uo pipefail
          cc=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#pkgsMusl.stdenv.cc^out')
          "$cc/bin/cc" -dumpmachine | grep -q musl || { echo "shim compiler is not musl" >&2; exit 1; }
          "$cc/bin/cc" -O2 -Wall -shared -fPIC -o "$RUNNER_TEMP/sigaltstack-amx.so" .github/smoke/sigaltstack-amx.c
          img=ghcr.io/mathiasror/varde-rabbitmq:latest-musl-amd64
          echo "-- without shim (control)"
          docker run --rm --entrypoint /runtime/bin/erl "$img" -noshell -eval 'io:format("varde ok~n"), erlang:halt().'
          echo "-- with shim (expect abort)"
          out=$(docker run --rm -v "$RUNNER_TEMP/sigaltstack-amx.so:/shim.so:ro" -e LD_PRELOAD=/shim.so \
                  --entrypoint /runtime/bin/erl "$img" -noshell -eval 'io:format("varde ok~n"), erlang:halt().' 2>&1)
          rc=$?
          echo "$out"; echo "exit=$rc"
          [ "$rc" -ne 0 ] && grep -q 'Failed to set alternate signal stack' <<< "$out"
